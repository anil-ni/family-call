<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Family Call</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Family Call" />
<meta name="theme-color" content="#111318" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="status-screen" class="screen">
    <h1>Family Call</h1>
    <p id="status-text">Connecting…</p>
  </div>

  <div id="call-screen" class="screen hidden">
    <div class="video-grid">
      <video id="remote-video" autoplay playsinline></video>
      <video id="local-video" autoplay playsinline muted></video>
    </div>
    <div class="controls">
      <button id="mic-btn" class="control-btn" title="Toggle microphone">🎤</button>
      <button id="cam-btn" class="control-btn" title="Toggle camera">📷</button>
      <button id="hangup-btn" class="control-btn hangup" title="Hang up">⏹</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="client.js"></script>
</body>
</html>
